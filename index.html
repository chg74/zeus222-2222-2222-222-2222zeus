<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Zeus Script</title>
<style>
:root{
  --text:#ffffff;
  --accent:#00e0ff;
  --vh: 1vh;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html{height:100%;overflow:hidden;position:fixed;width:100%;top:0;left:0}
body{
  height:100%;width:100%;
  background:#050510;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Tahoma,Arial,sans-serif;
  display:flex;justify-content:center;align-items:center;
  overflow:hidden;
  position:fixed;top:0;left:0;right:0;bottom:0;
  overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}

.app{
  width:100%;max-width:400px;
  height: calc(var(--vh, 1vh) * 100);
  background:#050510;
  position:relative;display:flex;flex-direction:column;overflow:hidden;
  border-radius:0;
  box-shadow:0 30px 80px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.04);
  z-index: 1;
  transform: translateZ(0);
  isolation: isolate;
}
@media (min-width:481px){ 
  .app{ height: min(calc(var(--vh, 1vh) * 100), 860px); border-radius:28px; } 
}

.bg-gradient {
  position: absolute; inset: 0; z-index: 0;
  background: 
    radial-gradient(circle at 15% 15%, rgba(0, 102, 255, 0.55) 0%, transparent 45%),
    radial-gradient(circle at 85% 85%, rgba(255, 51, 102, 0.55) 0%, transparent 45%),
    radial-gradient(circle at 85% 15%, rgba(168, 85, 247, 0.35) 0%, transparent 50%),
    radial-gradient(circle at 15% 85%, rgba(255, 51, 102, 0.3) 0%, transparent 50%),
    linear-gradient(135deg, #0a0a1f 0%, #150a1a 50%, #0a0a1f 100%);
  animation: gradientPulse 8s ease-in-out infinite alternate;
}
@keyframes gradientPulse { 0% { opacity: 0.85; } 100% { opacity: 1; } }

.bg-grid {
  position: absolute; inset: -60px; z-index: 0;
  background-image:
    linear-gradient(rgba(0, 224, 255, 0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 224, 255, 0.04) 1px, transparent 1px);
  background-size: 60px 60px;
  animation: moveGrid 30s linear infinite;
  -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 20%, transparent 85%);
  mask-image: radial-gradient(circle at 50% 50%, #000 20%, transparent 85%);
}
@keyframes moveGrid {
  from { transform: translate3d(0, 0, 0); }
  to { transform: translate3d(60px, 60px, 0); }
}

.screen{
  position:absolute;inset:0;padding:30px 26px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;transform:translateY(8px);pointer-events:none;
  transition:opacity .35s ease, transform .35s ease;
  z-index: 2;
}
.screen.active{opacity:1;transform:translateY(0);pointer-events:auto;}

.logo-wrap {
  position: relative;
  width: clamp(100px, 28vw, 125px);
  height: clamp(100px, 28vw, 125px);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 24px;
}
.logo-halo {
  position: absolute; inset: -25px; border-radius: 50%;
  background: radial-gradient(circle, rgba(0,224,255,0.45) 0%, rgba(0,224,255,0.1) 40%, transparent 70%);
  filter: blur(15px);
  animation: haloPulse 3s ease-in-out infinite;
  pointer-events: none;
}
@keyframes haloPulse {
  0%,100% { opacity: 0.6; transform: scale(0.9); }
  50% { opacity: 1; transform: scale(1.15); }
}
.logo-orbit {
  position: absolute; inset: -6px; border-radius: 50%;
  animation: rotateRing 12s linear infinite;
  pointer-events: none;
}
.logo-dot {
  position: absolute; top: -5px; left: 50%;
  width: 9px; height: 9px; margin-left: -4.5px;
  background: #00e0ff; border-radius: 50%;
  box-shadow: 0 0 12px #00e0ff, 0 0 25px #00e0ff;
}
.logo-dot.dot-2 {
  top: auto; bottom: -5px; background: #a855f7;
  box-shadow: 0 0 12px #a855f7, 0 0 25px #a855f7;
}
.logo-dot.dot-3 {
  top: 50%; left: -5px; right: auto;
  margin-left: 0; margin-top: -4.5px;
  background: #0066ff; box-shadow: 0 0 12px #0066ff, 0 0 25px #0066ff;
}
.logo-ring {
  position: absolute; inset: -2px; border-radius: 50%;
  border: 1px dashed rgba(0,224,255,0.35);
  pointer-events: none;
}
.logo-ring.ring-a { animation: rotateRing 22s linear infinite; }
.logo-ring.ring-b { inset: -14px; border-color: rgba(168,85,247,0.3); animation: rotateRingReverse 32s linear infinite; }
.logo-img {
  width: 100%; height: 100%; object-fit: contain;
  position: relative; z-index: 2;
  animation: logoGlow 3s ease-in-out infinite alternate;
}
@keyframes logoGlow {
  0% { filter: drop-shadow(0 0 12px rgba(0,224,255,0.5)) drop-shadow(0 0 25px rgba(0,224,255,0.25)); transform: scale(1); }
  100% { filter: drop-shadow(0 0 25px rgba(0,224,255,0.9)) drop-shadow(0 0 55px rgba(0,224,255,0.5)); transform: scale(1.03); }
}
@keyframes rotateRing { to { transform: rotate(360deg); } }
@keyframes rotateRingReverse { to { transform: rotate(-360deg); } }

.id-form {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 18px;
  margin-top: 6px;
}
.field-group {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
}
.id-label {
  text-align: center;
  font-size: 13px;
  letter-spacing: 7px;
  font-weight: 700;
  color: #8ac4ff;
  text-transform: uppercase;
  text-shadow: 0 0 15px rgba(0,224,255,0.9), 0 0 30px rgba(0,102,255,0.5);
  font-family: 'Georgia', 'Times New Roman', serif;
  font-style: italic;
}
.input-field {
  position: relative;
  width: 100%;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 20px;
  background: linear-gradient(135deg, rgba(0,224,255,0.08), rgba(168,85,247,0.05));
  border: 1.5px solid rgba(0, 224, 255, 0.4);
  border-radius: 18px;
  transition: all 0.4s ease;
  overflow: hidden;
  box-shadow: 0 8px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
}
.input-field::before {
  content: '';
  position: absolute; top: 0; right: 0;
  width: 4px; height: 100%;
  background: linear-gradient(to bottom, #00e0ff, #a855f7);
  box-shadow: 0 0 15px rgba(0,224,255,0.8);
}
.input-field:focus-within {
  border-color: #00e0ff;
  background: linear-gradient(135deg, rgba(0,224,255,0.14), rgba(168,85,247,0.08));
  box-shadow: 0 8px 30px rgba(0,0,0,0.5), 0 0 40px rgba(0,224,255,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
}
.input-field.error {
  border-color: #ff3366;
  animation: shake 0.4s ease;
}
.input-field.error::before {
  background: linear-gradient(to bottom, #ff3366, #ff0080);
  box-shadow: 0 0 15px rgba(255,51,102,0.8);
}
.input-field.error .input-icon {
  stroke: #ff3366;
  filter: drop-shadow(0 0 6px rgba(255,51,102,0.8));
}
.input-icon {
  width: 24px; height: 24px;
  flex-shrink: 0;
  stroke: #00e0ff;
  fill: none;
  stroke-width: 2;
  filter: drop-shadow(0 0 6px rgba(0, 224, 255, 0.8));
  transition: 0.3s;
}
.input-field:focus-within .input-icon {
  transform: scale(1.15);
  stroke: #fff;
  filter: drop-shadow(0 0 10px rgba(255, 255, 255, 1));
}
.id-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: #fff;
  font-size: 18px;
  font-weight: 700;
  font-family: 'SF Mono', Menlo, monospace;
  letter-spacing: 4px;
  padding: 2px 0;
  min-width: 0;
  text-align: right;
  direction: ltr;
}
.id-input::placeholder {
  color: #4a5a6a;
  font-weight: 400;
  letter-spacing: 1px;
  font-size: 14px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  text-align: right;
  direction: rtl;
}
.connect-btn {
  position: relative;
  width: 100%;
  padding: 17px;
  background: linear-gradient(135deg, #00e0ff 0%, #0066ff 50%, #a855f7 100%);
  background-size: 200% 200%;
  border: none;
  border-radius: 18px;
  color: #fff;
  font-size: 17px;
  font-weight: 900;
  letter-spacing: 6px;
  cursor: pointer;
  transition: all 0.4s ease;
  box-shadow: 0 12px 35px rgba(0, 224, 255, 0.45), 0 0 0 1px rgba(255,255,255,0.15) inset, 0 -3px 0 rgba(0,0,0,0.3) inset;
  overflow: hidden;
  animation: gradientShift 5s ease infinite;
  font-family: inherit;
  text-shadow: 0 2px 8px rgba(0,0,0,0.4);
  margin-top: 10px;
}
@keyframes gradientShift {
  0%,100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}
.connect-btn:active {
  transform: scale(0.97) translateY(2px);
  box-shadow: 0 5px 20px rgba(0, 224, 255, 0.6);
}
.error-msg {
  text-align: center;
  font-size: 14px;
  color: #ff3366;
  letter-spacing: 2px;
  opacity: 0;
  max-height: 0;
  transition: all 0.3s ease;
  font-weight: 700;
  text-shadow: 0 0 15px rgba(255,51,102,0.8);
}
.error-msg.show {
  opacity: 1;
  max-height: 30px;
}

.title-text{font-size:16px;font-weight:800;letter-spacing:.3px;margin-bottom:6px;text-align:center}
.subtitle-text{font-size:12.5px;color:#7a7a7a;margin-bottom:26px;text-align:center}
.operator-box{
  width:100%;border:1px solid rgba(0, 224, 255, 0.15);padding:2px 20px;border-radius:20px;
  background:linear-gradient(180deg, rgba(0, 224, 255, 0.03), rgba(255,255,255,0));
  box-shadow:0 20px 40px rgba(0,0,0,.5);
}
.operator-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 2px;cursor:pointer;border-bottom:1px solid rgba(0, 224, 255, 0.08);
}
.operator-item:last-child{border-bottom:none;}
.operator-item:active{transform:scale(.985);}
.operator-img{height:52px;width:auto;max-width:160px;object-fit:contain;display:block;}
.checkbox{
  width:24px;height:24px;border:2px solid #444;border-radius:8px;
  display:flex;justify-content:center;align-items:center;flex-shrink:0;
  background:#0d0d0d;transition:.25s ease;
}
.checkbox.active{border-color:var(--accent);background:rgba(0,224,255,.1);box-shadow:0 0 14px rgba(0,224,255,.35)}
.checkbox.active::after{content:'✔';font-size:13px;color:var(--accent);}

.loading-overlay{
  position:absolute;inset:0;z-index:100;
  background:rgba(0,0,0,.75);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .3s ease;
}
.loading-overlay.show{opacity:1;pointer-events:auto;}
.loading-card{
  width:270px;background:#fff;color:#000;border-radius:16px;
  padding:22px 18px 18px;text-align:center;
  box-shadow:0 25px 60px rgba(0, 224, 255, 0.3);
  transform:scale(.9);transition:transform .35s cubic-bezier(.2,.9,.3,1.2);
}
.loading-overlay.show .loading-card{transform:scale(1);}
.spinner-lg{
  width:44px;height:44px;border:4px solid #ececec;border-top-color:#00e0ff;
  border-radius:50%;margin:0 auto 14px;animation:spin .9s linear infinite;
}
.loading-title{font-size:15px;font-weight:800;color:#111;margin-bottom:4px}
.loading-sub{font-size:12.5px;color:#888;line-height:1.5}
@keyframes spin{to{transform:rotate(360deg)}}

.dashboard-screen{ justify-content: center; padding-top: 90px; }
.header-timer{
  position: absolute; top: 30px; left: 0; width: 100%;
  text-align: center;
  font-family: 'SF Mono', Menlo, monospace;
  font-size: 28px; font-weight: 800; letter-spacing: 3px;
  color: #eaeaea;
  text-shadow: 0 0 22px rgba(0, 224, 255, 0.4);
}
.main-title{
  font-size: 22px; font-weight: 900; letter-spacing: 5px;
  margin: 8px 0 26px;
  background: linear-gradient(180deg,#fff,#8a8a8a);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  text-align: center;
}

.circle-container{
  width: 300px; height: 300px;
  border-radius: 50%;
  display: flex; justify-content: center; align-items: center;
  margin: 0 auto 30px;
  position: relative;
  background: radial-gradient(circle at center, #0a1118 0%, #000 80%);
  box-shadow: 
      0 0 80px rgba(0, 224, 255, 0.15),
      inset 0 0 80px rgba(0, 224, 255, 0.12),
      0 0 0 1px rgba(0, 224, 255, 0.15);
  overflow: visible;
  cursor: pointer;
  transition: transform 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}
.circle-container:active {
  transform: scale(0.97);
}

.snake-outer {
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  background: conic-gradient(
    from 0deg,
    transparent 0deg,
    transparent 270deg,
    rgba(0, 224, 255, 0.1) 285deg,
    rgba(0, 224, 255, 0.5) 310deg,
    #00e0ff 345deg,
    #ffffff 358deg,
    #ffffff 360deg
  );
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 4px));
          mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 4px));
  animation: snakeOuter 3s linear infinite;
  filter: drop-shadow(0 0 12px #00e0ff) drop-shadow(0 0 24px rgba(0, 224, 255, 0.7));
  z-index: 2;
  pointer-events: none;
  will-change: transform;
}
@keyframes snakeOuter { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.snake-inner {
  position: absolute;
  inset: 14px;
  border-radius: 50%;
  background: conic-gradient(
    from 0deg,
    transparent 0deg,
    transparent 280deg,
    rgba(168, 85, 247, 0.1) 295deg,
    rgba(168, 85, 247, 0.5) 320deg,
    #a855f7 350deg,
    #ffffff 359deg,
    #ffffff 360deg
  );
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
          mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
  animation: snakeInner 5s linear infinite reverse;
  filter: drop-shadow(0 0 10px #a855f7) drop-shadow(0 0 20px rgba(168, 85, 247, 0.6));
  z-index: 2;
  pointer-events: none;
  will-change: transform;
}
@keyframes snakeInner { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.snake-head-outer {
  position: absolute;
  top: -3px; left: 50%;
  width: 12px; height: 12px;
  margin-left: -6px;
  background: #fff;
  border-radius: 50%;
  box-shadow: 0 0 15px #fff, 0 0 30px #00e0ff, 0 0 45px #00e0ff;
  z-index: 5;
  animation: snakeHeadOuter 3s linear infinite;
  pointer-events: none;
  transform-origin: 6px 156px;
  will-change: transform;
}
@keyframes snakeHeadOuter { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.snake-head-inner {
  position: absolute;
  top: 14px; left: 50%;
  width: 9px; height: 9px;
  margin-left: -4.5px;
  background: #fff;
  border-radius: 50%;
  box-shadow: 0 0 12px #fff, 0 0 24px #a855f7, 0 0 36px #a855f7;
  z-index: 5;
  animation: snakeHeadInner 5s linear infinite reverse;
  pointer-events: none;
  transform-origin: 4.5px 136px;
  will-change: transform;
}
@keyframes snakeHeadInner { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.circle-grid {
  position: absolute; inset: 30px;
  border-radius: 50%;
  background-image: 
      linear-gradient(rgba(0,224,255,0.1) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,224,255,0.1) 1px, transparent 1px);
  background-size: 25px 25px;
  -webkit-mask-image: radial-gradient(circle, #000 30%, transparent 75%);
  mask-image: radial-gradient(circle, #000 30%, transparent 75%);
  animation: gridMove 5s linear infinite;
  z-index: 0;
  will-change: transform;
}
@keyframes gridMove {
  from { transform: translate3d(0, 0, 0); }
  to { transform: translate3d(25px, 25px, 0); }
}

.radar-sweep {
  position: absolute; inset: 35px;
  border-radius: 50%;
  background: conic-gradient(from 0deg, transparent 0%, transparent 65%, rgba(0,224,255,0.6) 100%);
  animation: rotateRing 3s linear infinite;
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
          mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
  filter: drop-shadow(0 0 8px #00e0ff);
  z-index: 1;
  will-change: transform;
}

.ring-dots {
  position: absolute; inset: 24px;
  border-radius: 50%;
  border: 1px dotted rgba(0, 224, 255, 0.4);
  z-index: 1;
}

.circle-glare {
  position: absolute;
  top: 6%; left: 14%;
  width: 72%; height: 35%;
  border-radius: 50%;
  background: linear-gradient(to bottom, rgba(255,255,255,0.1), transparent 80%);
  transform: rotate(-15deg);
  pointer-events: none;
  z-index: 3;
}

.impact-ring {
  position: absolute;
  width: 100%; height: 100%;
  border-radius: 50%;
  border: 2px solid #00e0ff;
  opacity: 0;
  z-index: 4;
  top: 0; left: 0;
  transform: scale(0);
  pointer-events: none;
}
.impact-ring.active { animation: impact 1.8s ease-out infinite; }
.impact-ring.active.ring-2 { animation-delay: 0.25s; border-color: #a855f7; }
@keyframes impact {
  0% { transform: scale(0); opacity: 0; }
  30% { transform: scale(0); opacity: 0; }
  45% { transform: scale(0.1); opacity: 1; border-width: 8px; }
  80% { transform: scale(1); opacity: 0; border-width: 1px; }
  100% { transform: scale(1); opacity: 0; }
}

.loading-drop {
  position: absolute;
  top: 50%; left: 50%;
  width: 6px; height: 50px;
  margin-top: -25px; margin-left: -3px;
  background: linear-gradient(to bottom, transparent, #00e0ff, #fff);
  border-radius: 50%;
  box-shadow: 0 0 25px #00e0ff, 0 0 50px #00e0ff;
  opacity: 0;
  z-index: 7;
  transform: translate3d(0, -200px, 0) scale(0);
  pointer-events: none;
}
.loading-drop.active {
  animation: dropBeam 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
}
@keyframes dropBeam {
  0%   { transform: translate3d(0, -200px, 0) scaleY(0.5); opacity: 0; }
  30%  { transform: translate3d(0, 0, 0) scaleY(1); opacity: 1; }
  45%  { transform: translate3d(0, 0, 0) scale(2) scaleY(4); opacity: 1; filter: blur(6px); }
  60%  { transform: translate3d(0, 0, 0) scale(0); opacity: 0; }
  100% { transform: translate3d(0, 0, 0) scale(0); opacity: 0; }
}

.circle-value{
  font-size: 68px;
  font-weight: 900;
  letter-spacing: 3px;
  font-family: 'SF Mono', Menlo, monospace;
  color: #fff;
  text-shadow: 0 0 10px #fff, 0 0 25px #00e0ff, 0 0 50px #0066ff;
  z-index: 10;
  animation: popIn 0.6s cubic-bezier(.2,.9,.3,1.3);
  position: relative;
  pointer-events: none;
}
@keyframes popIn{
  from{opacity:0;transform:scale(.6)}
  to{opacity:1;transform:scale(1)}
}

.footer-text{margin-top:32px;font-size:10.5px;color:#4a4a4a;letter-spacing:3px;text-transform:uppercase;}
.hidden{display:none !important;}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}
</style>
</head>
<body>

<div class="app">
  <div class="bg-gradient"></div>
  <div class="bg-grid"></div>

  <!-- شاشة الدخول -->
  <div id="accountScreen" class="screen active">
    <div class="logo-wrap">
      <div class="logo-halo"></div>
      <div class="logo-ring ring-a"></div>
      <div class="logo-ring ring-b"></div>
      <div class="logo-orbit">
        <div class="logo-dot"></div>
        <div class="logo-dot dot-2"></div>
        <div class="logo-dot dot-3"></div>
      </div>
      <img src="https://i.postimg.cc/RVQHkTkf/Photoroom-20260922-022921.png" class="logo-img" alt="Zeus Logo">
    </div>

    <div class="id-form">
      <div class="field-group">
        <div class="id-label">ID Account</div>
        <div class="input-field" id="idField">
          <svg class="input-icon" viewBox="0 0 24 24">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input type="text" id="accountIdInput" class="id-input" placeholder="اكتب الـ ID" autocomplete="off">
        </div>
      </div>

      <div class="field-group">
        <div class="id-label">Password</div>
        <div class="input-field" id="passField">
          <svg class="input-icon" viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="passwordInput" class="id-input" placeholder="••••" inputmode="numeric" autocomplete="off" maxlength="8">
        </div>
      </div>
      
      <div class="error-msg" id="errorMsg">كلمة السر خاطئة</div>
      
      <button class="connect-btn" onclick="connectAccount()">اتصال</button>
    </div>
  </div>

  <!-- شاشة اختيار السيرفر -->
  <div id="selectionScreen" class="screen">
    <div class="logo-wrap">
      <div class="logo-halo"></div>
      <div class="logo-orbit">
        <div class="logo-dot"></div>
        <div class="logo-dot dot-2"></div>
      </div>
      <img src="https://i.postimg.cc/RVQHkTkf/Photoroom-20260922-022921.png" class="logo-img" alt="Zeus Logo">
    </div>
    <div class="title-text">Choose your service operator</div>
    <div class="subtitle-text">قم باختيار السيرفر الخاص بك</div>
    <div class="operator-box">
      <div class="operator-item" onclick="selectOperator('1xbet', this)">
        <img src="https://i.postimg.cc/FFp3YpKY/Picsart-26-09-22-02-04-31-031.png" class="operator-img" alt="1xbet">
        <div class="checkbox"></div>
      </div>
      <div class="operator-item" onclick="selectOperator('LINEBET', this)">
        <img src="https://i.postimg.cc/NGDmKD09/Picsart-26-09-22-02-04-55-965.png" class="operator-img" alt="LINEBET">
        <div class="checkbox"></div>
      </div>
      <div class="operator-item" onclick="selectOperator('MELBET', this)">
        <img src="https://i.postimg.cc/Df6LS6zW/Picsart-26-09-22-02-05-17-301.png" class="operator-img" alt="MELBET">
        <div class="checkbox"></div>
      </div>
    </div>
  </div>

  <!-- Loading -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="loading-card">
      <div class="spinner-lg"></div>
      <div class="loading-title" id="loadingTitle">جاري الاتصال...</div>
      <div class="loading-sub" id="loadingSub">يتم الاتصال بسيرفر 1xbet، يرجى الانتظار</div>
    </div>
  </div>

  <!-- شاشة التوقعات -->
  <div id="dashboardScreen" class="screen dashboard-screen">
    <div class="header-timer" id="timerDisplay">03:00:00</div>
    
    <div class="logo-wrap" style="width:100px;height:100px;margin:0 0 4px;">
      <div class="logo-halo" style="inset:-15px;"></div>
      <img src="https://i.postimg.cc/RVQHkTkf/Photoroom-20260922-022921.png" class="logo-img" alt="Zeus Logo">
    </div>
    <div class="main-title">ZEUS SCRIPT</div>
    
    <!-- الدائرة - عرض تلقائي بدون ضغط -->
    <div class="circle-container" id="circleContainer">
      <div class="snake-outer"></div>
      <div class="snake-head-outer"></div>
      
      <div class="snake-inner"></div>
      <div class="snake-head-inner"></div>
      
      <div class="circle-grid"></div>
      <div class="radar-sweep"></div>
      <div class="ring-dots"></div>
      <div class="circle-glare"></div>
      
      <div class="impact-ring" id="impactRing1"></div>
      <div class="impact-ring ring-2" id="impactRing2"></div>
      
      <div class="loading-drop" id="loadingDrop"></div>
      
      <div class="circle-value hidden" id="valueDisplay">0.00</div>
    </div>
    
    <div class="footer-text">WELCOME TO ZEUS SCRIPT</div>
  </div>
</div>

<script type="module">
// ============================================================
//  إعدادات
// ============================================================
const API_URL = 'https://thanos.icu/crash/v-1/api.php';
const REFRESH_INTERVAL = 4000; // كل 4 ثواني (تقدر تغيرها)

// ============================================================
//  متغيرات الحالة
// ============================================================
let isAnimating = false;
let currentSignal = null;
let lastSignal = null;
let refreshTimer = null;

// ============================================================
//  ضبط ارتفاع الشاشة (viewport)
// ============================================================
function setVH() {
  const vh = window.innerHeight * 0.01;
  document.documentElement.style.setProperty('--vh', vh + 'px');
}
setVH();
window.addEventListener('resize', setVH);
window.addEventListener('orientationchange', () => setTimeout(setVH, 200));

// ============================================================
//  التنقل بين الشاشات
// ============================================================
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ============================================================
//  شاشة الاتصال
// ============================================================
const VALID_PASSWORD = "1234";

window.connectAccount = function(){
  const inputPass = document.getElementById('passwordInput').value.trim();
  const passField = document.getElementById('passField');
  const errorMsg = document.getElementById('errorMsg');

  passField.classList.remove('error');
  errorMsg.classList.remove('show');

  if (!inputPass || inputPass !== VALID_PASSWORD) {
    passField.classList.add('error');
    errorMsg.classList.add('show');
    setTimeout(()=>{ passField.classList.remove('error'); }, 500);
    setTimeout(()=>{ errorMsg.classList.remove('show'); }, 2500);
    return;
  }

  showScreen('selectionScreen');
};

// ============================================================
//  اختيار السيرفر
// ============================================================
window.selectOperator = function(operatorName, element){
  document.querySelectorAll('.checkbox').forEach(cb=>cb.classList.remove('active'));
  element.querySelector('.checkbox').classList.add('active');

  const overlay = document.getElementById('loadingOverlay');
  document.getElementById('loadingTitle').innerText = 'جاري الاتصال...';
  document.getElementById('loadingSub').innerText = `يتم الاتصال بسيرفر ${operatorName}، يرجى الانتظار`;
  overlay.classList.add('show');

  setTimeout(()=>{
    overlay.classList.remove('show');
    showScreen('dashboardScreen');
    startTopTimer(10800);
    // نبدأ جلب التوقعات فوراً بعد الدخول
    startAutoPrediction();
  }, 2200);
};

// ============================================================
//  المؤقت العلوي (ثابت)
// ============================================================
let topTimerInterval;

function startTopTimer(totalSeconds){
  clearInterval(topTimerInterval);
  let remaining = totalSeconds;
  updateTopTimer(remaining);
  topTimerInterval = setInterval(()=>{
    if (remaining > 0){ remaining--; updateTopTimer(remaining); }
    else { clearInterval(topTimerInterval); }
  },1000);
}

function updateTopTimer(seconds){
  const h=Math.floor(seconds/3600).toString().padStart(2,'0');
  const m=Math.floor((seconds%3600)/60).toString().padStart(2,'0');
  const s=(seconds%60).toString().padStart(2,'0');
  document.getElementById('timerDisplay').innerText=`${h}:${m}:${s}`;
}

// ============================================================
//  جلب التوقع من API
// ============================================================
async function fetchSignal() {
  try {
    const response = await fetch(API_URL, {
      method: 'GET',
      cache: 'no-store'
    });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const data = await response.json();

    if (data && data.signal !== undefined && data.signal !== null) {
      const value = parseFloat(data.signal).toFixed(2);

      // لو القيمة اتغيرت عن آخر مرة، نعرضها
      if (value !== lastSignal) {
        lastSignal = value;
        await displaySignal(value);
      }
    }
  } catch (err) {
    console.error('خطأ في جلب التوقع:', err);
    // مش هنعمل حاجة، هنسيب آخر قيمة معروضة
  }
}

// ============================================================
//  عرض التوقع مع الأنيميشن
// ============================================================
function displaySignal(value) {
  return new Promise((resolve) => {
    // لو في أنيميشن شغال، نستنى شوية ونحاول تاني
    if (isAnimating) {
      resolve();
      return;
    }

    isAnimating = true;

    const valueEl = document.getElementById('valueDisplay');
    const dropEl = document.getElementById('loadingDrop');
    const ring1 = document.getElementById('impactRing1');
    const ring2 = document.getElementById('impactRing2');

    // نخفي الرقم القديم ونشغل أنيميشن التحميل
    valueEl.classList.add('hidden');
    dropEl.classList.add('active');
    ring1.classList.add('active');
    ring2.classList.add('active');

    setTimeout(()=>{
      // نوقف التحميل
      dropEl.classList.remove('active');
      ring1.classList.remove('active');
      ring2.classList.remove('active');

      // نعرض التوقع الجديد
      valueEl.classList.remove('hidden');
      valueEl.innerText = value;

      // إعادة تشغيل أنيميشن popIn
      valueEl.style.animation = 'none';
      void valueEl.offsetWidth;
      valueEl.style.animation = 'popIn 0.6s cubic-bezier(.2,.9,.3,1.3)';

      isAnimating = false;
      resolve();
    }, 1800);
  });
}

// ============================================================
//  بدء التحديث التلقائي
// ============================================================
function startAutoPrediction() {
  // نجيب أول قيمة فوراً
  fetchSignal();

  // نكرر الجلب كل REFRESH_INTERVAL
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(fetchSignal, REFRESH_INTERVAL);
}

// ============================================================
//  تنظيف عند إغلاق الصفحة
// ============================================================
window.addEventListener('beforeunload', ()=>{
  if (refreshTimer) clearInterval(refreshTimer);
  if (topTimerInterval) clearInterval(topTimerInterval);
});
</script>
</body>
</html>
